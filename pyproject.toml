[project]
name = "loup-garou-discord"
version = "0.1.0"
description = "A Discord bot for playing Loup-Garou / Werewolf."
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.4,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
